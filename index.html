function freq(rs,get){const f={};rs.forEach(r=>get(r).filter(Boolean).forEach(x=>f[x]=(f[x]||0)+1));return Object.entries(f).sort((a,b)=>b[1]-a[1])}

function dashboard(){const rs=completed(),rated=rs.filter(r=>r.score),days=new Set(rs.map(r=>r.end).filter(Boolean)),rew=rs.filter(r=>r.rewatch).length,counts=MONTHS.map((_,i)=>rs.filter(r=>Number(r.end?.slice(5,7))===i+1).length),max=Math.max(1,...counts),duration=rs.filter(r=>r.start&&r.end).map(r=>Math.round((Date.parse(r.end)-Date.parse(r.start))/86400000)+1).filter(n=>n>0),undated=db.records.filter(inSection).filter(r=>r.status==='Done'&&!r.end).length;$('#inner').innerHTML=`<div class="stats-grid">${metric('Завершено',rs.length,year==='all'?'За всё время':year)}${metric('Средняя оценка',rated.length?(rated.reduce((s,r)=>s+r.score,0)/rated.length).toFixed(1):'—','из 5 звёзд')}${metric('Дней с завершениями',days.size)}${metric('Пересмотры',rew)}</div><div class="dash-grid"><div class="panel wide"><h3>Ритм просмотров</h3><div class="bars">${counts.map((n,i)=>`<div class="bar"><span>${n||''}</span><i style="height:${n/max*130}px"></i><span>${MONTHS[i]}</span></div>`).join('')}</div></div><div class="panel"><h3>Твои направления</h3>${ranks(freq(rs,r=>r.tags))}</div><div class="panel"><h3>География историй</h3>${ranks(freq(rs,r=>r.country.split(',').map(x=>x.trim())))}</div><div class="panel"><h3>Как ты оцениваешь</h3>${ranks([5,4,3,2,1].map(n=>['★'.repeat(n),rs.filter(r=>r.score===n).length]))}</div><div class="panel"><h3>Любимые десятилетия</h3>${ranks(freq(rs,r=>/^\d{4}$/.test(r.release)?[Math.floor(Number(r.release)/10)*10+'-е']:[]))}</div><div class="panel"><h3>Режиссёры</h3>${ranks(freq(rs,r=>r.director?[r.director]:[]))}</div><div class="panel"><h3>Музыка историй</h3>${ranks(freq(rs,r=>r.composer?[r.composer]:[]))}</div><div class="panel"><h3>Первый просмотр / пересмотр</h3>${ranks([['Первый просмотр',rs.filter(r=>!r.rewatch&&!r.imported).length],['Пересмотр',rew],['Не отмечено в импорте',rs.filter(r=>r.imported&&!r.rewatch).length]])}</div><div class="panel"><h3>${tab==='films'?'Новинки и знакомая классика':'Длина одной истории'}</h3>${tab==='films'?ranks([['Новинка',rs.filter(r=>r.era==='new').length],['Классика',rs.filter(r=>r.era==='classic').length],['Другие годы',rs.filter(r=>r.era==='older').length],['Не отмечено',rs.filter(r=>!r.era).length]]):`<p class="display" style="font-size:42px">${duration.length?Math.round(duration.reduce((a,b)=>a+b,0)/duration.length):'—'} <span style="font-size:20px">дней в среднем</span></p><p class="hint">По ${duration.length} записям с датами начала и окончания</p>`}</div></div><p class="hint">${undated?`${undated} завершённых записей без даты учитываются только при выборе «Все годы». `:''}Направления и страны могут пересекаться.</p>`}

calendar=function(){const y=year==='all'?calYear:+year,counts={},keys={};for(let i=1;i<=12;i++)for(let d=1;d<=new Date(y,i,0).getDate();d++){const k=`${y}-${String(i).padStart(2,'0')}-${String(d).padStart(2,'0')}`;keys[k]=dailyRecords(k);counts[k]=keys[k].length}const mini=Array.from({length:12},(_,i)=>`<button class="mini-month ${month===i?'chosen':''}" data-cal-month="${i}"><b>${new Date(y,i,1).toLocaleDateString('ru-RU',{month:'long'})}</b><span class="heat-grid">${'<i class="blank"></i>'.repeat((new Date(y,i,1).getDay()+6)%7)}${Array.from({length:new Date(y,i+1,0).getDate()},(_,d)=>{const k=`${y}-${String(i+1).padStart(2,'0')}-${String(d+1).padStart(2,'0')}`;return `<i class="heat h${Math.min(3,counts[k])}" title="${k}: ${counts[k]}"></i>`}).join('')}</span><small>${Object.entries(counts).filter(([k,n])=>+k.slice(5,7)===i+1&&n>0).length} дней просмотра</small></button>`).join('');let cells='<div class="day blank"></div>'.repeat((new Date(y,month,1).getDay()+6)%7);for(let d=1;d<=new Date(y,month+1,0).getDate();d++){const k=`${y}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,items=keys[k];cells+=`<button class="day ${items.length?'has':''} ${day===k?'chosen':''}" data-common-day="${k}"><b>${d}</b>${items.slice(0,3).map(r=>`<small class="calendar-story ${episodic(r)?'series-day':'film-day'}">${episodic(r)?'♡':'▶'} ${E(r.title)}</small>`).join('')}${items.length>3?`<small>+${items.length-3}</small>`:''}</button>`}$('#inner').innerHTML=`<div class="panel"><div class="calendar-head"><button class="btn month-arrow" data-common-step="-1" aria-label="Предыдущий месяц">‹</button><h2>${new Date(y,month,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</h2><button class="btn month-arrow" data-common-step="1" aria-label="Следующий месяц">›</button></div><div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<span class="weekday">${d}</span>`).join('')}${cells}</div></div>${day?`<div class="section-heading"><h2>${date(day)}</h2>${day<=dayKey()?`<button class="btn blue small" data-log-date="${day}">＋ Отметить просмотр</button>`:''}</div><div class="cards">${cards(keys[day]||[])}</div>`:''}<div class="calendar-legend"><span><i style="background:var(--pink)"></i>Сериалы / дорамы</span><span><i style="background:var(--blue)"></i>Фильмы</span></div><div class="section-heading"><h2>Год целиком · ${y}</h2></div><div class="year-heat">${mini}</div>`};

dashboard=function(){const rs=completed(),a=avg(rs),ranking=(title,data)=>`<section class="panel"><h3>${title}</h3>${ranks(data)}</section>`;$('#inner').innerHTML=`<div class="stats-grid">${metric('Просмотрено',rs.length)}${metric('Средняя оценка',a?.toFixed(1)||'—','из 5')}${metric('На пять звёзд',rs.filter(r=>r.score===5).length)}${metric('Пересмотры',rs.filter(r=>r.rewatch).length)}</div><div class="dash-grid">${plot('Истории по месяцам',MONTHS.map((m,i)=>[m,rs.filter(r=>+r.end?.slice(5,7)===i+1).length]))}${ranking('Направления',freq(rs,r=>r.tags).slice(0,5))}${ranking('Оценки',[5,4,3,2,1].map(n=>['★'.repeat(n),rs.filter(r=>r.score===n).length]))}${ranking('Страны',freq(rs,r=>r.country.split(',').map(x=>x.trim())).slice(0,5))}</div><div class="section-heading"><button class="btn" id="more-stats" aria-expanded="${expandedDash}">${expandedDash?'Скрыть подробности':'Ещё статистика'} ${expandedDash?'⌃':'⌄'}</button></div><div id="extra-stats" ${expandedDash?'':'hidden'}></div>`;if(expandedDash){const saved=$('#inner').innerHTML;detailedDashboard();const detailed=$('#inner .dash-grid');const panels=Array.from(detailed.children).filter((p,i)=>![0,2,3,4].includes(i)).map(p=>p.outerHTML).join('');$('#inner').innerHTML=saved;$('#extra-stats').innerHTML='<div class="dash-grid">'+panels+'</div>'}$('#more-stats').onclick=()=>{expandedDash=!expandedDash;dashboard()}};

document.addEventListener('click',e=>{const today=e.target.closest('#today');if(today)dailyDialog();const log=e.target.closest('[data-log]');if(log)dailyDialog(log.dataset.log);const pick=e.target.closest('[data-choose-log]');if(pick)dailyDialog(pick.dataset.chooseLog,loggingDate);const d=e.target.closest('[data-log-date]');if(d)dailyDialog(null,d.dataset.logDate);if(e.target.closest('#new-from-log'))editCard(null);const un=e.target.closest('[data-unlog]');if(un){const r=db.records.find(r=>r.id===un.dataset.unlog);r.watchDays=r.watchDays.filter(d=>d!==un.dataset.logday);save();render();openCard(r.id);toast('Отметка убрана')}});

let watchFilter='all',logMode='current',newLogPending=false;
function sessionFrom(r){return {id:uid(),kind:r.rewatch?'rewatch':r.imported?'unknown':'first',status:r.status,start:r.start||'',end:r.end||'',days:[...(r.watchDays||[])],period:r.archivePeriod?{...r.archivePeriod}:null,score:r.score||0,review:r.review||'',comment:r.comment||''}}
function goalCount(types,y){return db.records.filter(r=>types.includes(r.type)).reduce((sum,r)=>{const completed=viewsOf(r).filter(v=>v.status==='Done'&&v.end?.startsWith(y+'-'));return sum+(types.includes('Film')?Number(completed.some(v=>v.kind!=='rewatch')):completed.length)},0)}
function dedupeWatchSessions(r){const seen=new Map(),out=[];for(const view of r.sessions||[]){const key=view.kind==='rewatch'&&view.status==='Done'&&view.end?JSON.stringify([view.kind,view.status,view.start||view.end,view.end]):null;const existing=key&&seen.get(key);if(!existing){out.push(view);if(key)seen.set(key,view);continue}existing.days=[...new Set([...(existing.days||[]),...(view.days||[])])].sort();for(const field of ['review','comment'])if(view[field]&&view[field]!==existing[field])existing[field]=existing[field]?existing[field]+'\n\n'+view[field]:view[field];for(const field of ['score','poster','posterRef','period'])if(!existing[field]&&view[field])existing[field]=view[field]}r.sessions=out}

function normalizeSessions(){for(const c of db.collections||[])c.recordIds=(c.recordIds||[]).map(String);for(const r of db.records){r.id=String(r.id);if(typeof r.imported!=='boolean')r.imported=seed.some(x=>x.id===r.id);if(!Array.isArray(r.sessions)||(!r.sessions.length&&['Done','In progress'].includes(r.status))){r.sessions=r.status==='Done'||r.status==='In progress'?[sessionFrom(r)]:[]}dedupeWatchSessions(r);r.watchDays=Array.isArray(r.watchDays)?r.watchDays:[];for(const v of r.sessions){v.days=Array.isArray(v.days)?v.days:[];v.status=v.status||r.status;v.start=v.start||r.start||'';v.end=v.end||((r.status==='Done'&&v===r.sessions.at(-1))?r.end:'')||''}}}
normalizeSessions();
// Fold only confirmed repeats into an exact matching title/type/release; keep every session and its notes.
function foldRepeats(){if(db.sessionSchema===1)return;const keep=[];for(const r of db.records){const match=r.rewatch&&keep.find(x=>x.title.trim().toLowerCase()===r.title.trim().toLowerCase()&&x.type===r.type&&String(x.release)===String(r.release));if(!match){keep.push(r);continue}for(const v of r.sessions){if(r.image&&r.image!==match.image)v.poster=r.image;match.sessions.push(v)}if(!match.review&&r.review)match.review=r.review;if(!match.score&&r.score)match.score=r.score;match.halls=[...new Set([...(match.halls||[]),...(r.halls||[])])];match.sessions.sort((a,b)=>String(a.start||a.end).localeCompare(String(b.start||b.end)));syncSession(match)}db.records=keep;db.sessionSchema=1}
function syncSession(r){const v=r.sessions.at(-1);if(!v)return;r.status=v.status;r.start=v.start;r.end=v.end;r.watchDays=v.days;r.archivePeriod=v.period;r.rewatch=v.kind==='rewatch'}
foldRepeats();
let sessionsDB=db;
function viewsOf(r){return r.sessions||[]}
function sessionDated(v){return year==='all'||v.end?.startsWith(year+'-')}
completed=function(){return db.records.filter(r=>tab==='portrait'||inSection(r)).flatMap(r=>viewsOf(r).filter(v=>v.status==='Done'&&sessionDated(v)).map(v=>({...r,start:v.start,end:v.end,rewatch:v.kind==='rewatch',imported:v.kind==='unknown',score:v.score||r.score,sessionId:v.id,kind:v.kind}))) };
renderGoals=function(){const y=year==='all'?String(CURRENT_YEAR):year,g=db.goals[y]||{films:10,dramas:10};$('#goals').innerHTML=[['films','Фильмы',r=>['Film','Cartoon'].includes(r.type)],['dramas','Дорамы',r=>r.type==='Kdrama']].map(([k,t,p])=>{const n=goalCount(k==='films'?['Film','Cartoon']:['Kdrama'],y);return `<button class="goal" data-goal="${y}"><span class="goal-label">${t} · ${y}</span><span class="goal-progress"><span class="progress"><i style="width:${Math.min(100,n/g[k]*100)}%"></i></span></span><span class="goal-num"><b>${n}</b> / ${g[k]}</span></button>`}).join('')};
function viewInYear(r){return viewsOf(r).filter(v=>v.status==='Done'&&sessionDated(v))}
hallRecords=function(key){return db.records.filter(inSection).filter(r=>{if(key==='Not started')return r.status==='Not started';if(key==='Done')return viewInYear(r).length>0;if(key==='In progress')return viewsOf(r).some(v=>v.status==='In progress'&&(year==='all'||v.days.some(d=>d.startsWith(year+'-'))||v.start?.startsWith(year+'-')));return false})};
listRecords=function(){return hallRecords(hall).filter(r=>r.title.toLowerCase().includes(search.toLowerCase())).filter(r=>typeFilter==='all'||r.type===typeFilter).filter(r=>hall!=='Done'||watchFilter==='all'||viewInYear(r).some(v=>watchFilter==='rewatch'?v.kind==='rewatch':v.kind==='first')).sort((a,b)=>sort==='title'?a.title.localeCompare(b.title,'ru'):sort==='score'?(b.score||0)-(a.score||0):String(b.end||'').localeCompare(String(a.end||'')))};
const previousHalls=renderHalls;
renderHalls=function(){previousHalls();if(hall==='Done')$('#inner .filters').insertAdjacentHTML('beforeend',select('watchfilter',watchFilter,[['all','Все просмотры'],['first','Впервые'],['rewatch','Пересмотр']]))};
function shelfCover(r){return `<div class="shelf-cover"><svg class="cover-spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2Q13 11 22 12Q13 13 12 22Q11 13 2 12Q11 11 12 2" fill="currentColor"/></svg><span class="eyebrow">Личный сеанс</span><span class="cover-title">${E(r.title||'Без названия')}</span><span class="cover-bottom">${E(labelType(r))} ${r.release?'· '+E(r.release):''}</span></div>`}
poster=function(r){return r.image?`<div class="poster detail-poster"><img src="${E(r.image)}" alt="${E(r.title)}"></div>`:`<div class="poster">${shelfCover(r)}</div>`};
cards=function(rs){rs=[...new Map(rs.map(r=>[r.id,r])).values()];return rs.length?rs.map(r=>`<button class="movie" data-open="${E(r.id)}">${shelfCover(r)}<h3>${E(r.title)}</h3><div class="meta">${r.score?'★'.repeat(r.score)+' · ':''}${E(labelType(r))}${isNew(r)?' · Новинка':''}${viewInYear(r).some(v=>v.kind==='rewatch')?' · Пересмотр':''}</div></button>`).join(''):'<div class="empty"><h3>Пока нет историй</h3></div>'};
reviewHTML=function(text){const names={Notes:'Что зацепило',Characters:'Персонажи',Quotes:'Цитаты',Summary:'Впечатления'},sections=[];let active={title:'',lines:[]};const flush=()=>{if(active.lines.some(l=>l.replace(/[\s>*_#—-]/g,'').length))sections.push(active)};for(const l of text.split('\n')){const m=l.match(/^#{1,3}\s+(.+)/);if(m){flush();active={title:names[m[1]]||m[1],lines:[]}}else if(l.trim()!=='---')active.lines.push(l)}flush();return sections.map(s=>`${s.title?'<h3>'+E(s.title)+'</h3>':''}${s.lines.filter(l=>l.replace(/[\s>*_—-]/g,'').length).map(l=>'<p>'+E(l.replace(/^[- >]+/,'').replace(/\*\*/g,''))+'</p>').join('')}`).join('')};
function viewRow(v,i){return `<div class="history-row"><span class="history-index">${String(i).padStart(2,'0')}</span><div><b>${v.kind==='rewatch'?'Пересмотр':v.kind==='first'?'Первый просмотр':'Просмотр'}</b><p>${v.start&&v.end&&v.start!==v.end?date(v.start)+' — '+date(v.end):date(v.end||v.start)}${v.status==='In progress'?' · смотрю':''}</p>${v.days.length?`<details class="day-disclosure"><summary>Отмеченные дни · ${v.days.length}</summary><div class="watch-dates">${v.days.map(d=>`<span class="chip">${date(d)}</span>`).join('')}</div></details>`:''}</div></div>`}
openCard=function(id){const r=db.records.find(x=>x.id===id);if(!r)return;const vs=viewsOf(r),shown=[...vs].reverse(),review=reviewHTML(r.review||'');openModal(`<div class="detail-grid"><div>${poster(r)}<div style="margin-top:15px"><button class="btn" data-edit="${E(id)}">Редактировать</button></div></div><div><span class="eyebrow">${E(labelType(r))} · ${E(r.release||'')}</span><h2 class="detail-title">${E(r.title)}</h2>${r.score?`<div class="stars">${'★'.repeat(r.score)}${'☆'.repeat(5-r.score)}</div>`:''}<span class="chip">${E(STAT[r.status]||'Хочу посмотреть')}</span> ${r.rewatch?'<span class="chip">Пересмотр</span>':''}<dl class="facts">${[['Страна',r.country],['Режиссёр',r.director],['Сценарий',r.writer],['Музыка',r.composer]].filter(x=>x[1]).map(([k,v])=>`<dt>${k}</dt><dd>${E(v)}</dd>`).join('')}</dl><div class="hall-list">${r.tags.map(t=>`<span class="chip">${E(t)}</span>`).join('')}</div>${r.link&&/^https?:\/\//.test(r.link)?`<p><a href="${E(r.link)}" target="_blank" rel="noopener">Страница фильма ↗</a></p>`:''}</div></div>${vs.length?`<section class="watch-history"><h3>${vs.length>1?'История просмотров':'Период просмотра'}${vs.length>1?' · '+vs.length:''}</h3>${shown.slice(0,3).map((v,i)=>viewRow(v,vs.length-i)).join('')}${vs.length>3?`<details class="history-disclosure"><summary>Все просмотры · ${vs.length}</summary>${shown.slice(3).map((v,i)=>viewRow(v,vs.length-3-i)).join('')}</details>`:''}</section>`:''}${r.comment?`<div class="insight">${E(r.comment)}</div>`:''}${review?`<div class="review">${review}</div>`:''}`,r.title)};
watchedOn=function(r,key){return viewsOf(r).some(v=>v.days.includes(key)||!!(episodic(r)&&v.period&&key>=v.period.start&&key<=v.period.end)||(!episodic(r)&&v.status==='Done'&&v.end===key))};
function recordDay(r,d,{finish=false,repeat=false}={}){let v=r.sessions.at(-1);if(repeat&&v?.status==='Done'&&v.end===d)return v;if(repeat){if(v?.status==='In progress')throw Error('Сначала заверши текущий просмотр');v=null}else if(v?.status==='Done'&&v.end&&d>v.end)throw Error('Для нового просмотра выбери пересмотр');if(!v){v={id:uid(),kind:repeat?'rewatch':'first',status:'In progress',start:d,end:'',days:[],period:null,score:r.score||0,review:'',comment:''};r.sessions.push(v)}if(finish&&v.days.some(x=>x>d))throw Error('Дата завершения раньше отмеченных дней');if(!v.days.includes(d))v.days.push(d);v.days.sort();v.start=!v.start||d<v.start?d:v.start;if(finish){v.status='Done';v.end=d;v.score=r.score||0}syncSession(r);return v}

 const specks=star(29,27,.65)+star(143,38,.5)+star(136,107,.45);
 let drawing='';
 if(theme==='newyear')drawing=`<path d="M62 9v35M108 16v49" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".65"/><rect x="56" y="41" width="12" height="7" rx="2" fill="currentColor"/><circle cx="62" cy="73" r="27" fill="var(--accent)"/><path d="M42 69q20 16 40 0M40 78q22 16 44 0" stroke="#faf8ed" stroke-width="2" opacity=".6" fill="none"/><path d="M49 55q-7 3-9 10" stroke="#faf8ed" stroke-width="3" opacity=".8" fill="none" stroke-linecap="round"/><rect x="102" y="62" width="12" height="7" rx="2" fill="var(--accent)"/><circle cx="108" cy="88" r="22" fill="currentColor" opacity=".72"/><path d="M108 76v24m-10-18 20 12m-20 0 20-12" stroke="#faf8ed" stroke-width="1.5" stroke-linecap="round"/><path d="M25 80v12m-5-9 10 6m-10 0 10-6M131 18v14m-6-10 12 6m-12 0 12-6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".65"/>`;
 else if(theme==='childhood')drawing=`<path d="M39 100q-23-21 4-27t21 27q-1 17-27 21" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 5"/><path d="M36 49l97-21-31 65-22-25-18 14 2-28Z" fill="#faf8ed"/><path d="M36 49l44 19 53-40-69 26-2 28 18-14 22 25 31-65" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M80 68l22 25 31-65Z" fill="var(--accent)" opacity=".6"/>`;
 else if(theme==='fantasy')drawing=`<path d="M101 21a45 45 0 1 0 23 78A42 42 0 0 1 101 21Z" fill="currentColor" opacity=".8"/><path d="M104 37l17 20 22-8-5 27-23 13" fill="none" stroke="var(--accent)" stroke-width="1.5"/>${[[104,37],[121,57],[143,49],[138,76],[115,89]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="var(--accent)"/>`).join('')}${star(91,68,1.2)}`;
 else if(theme==='favorite-dramas'||theme==='romance')drawing=`<path d="M81 94C21 62 44 28 65 40q11 4 16 15 5-11 16-15c21-12 44 22-16 54Z" fill="var(--accent)"/><path d="M36 98q45 25 90 0M46 108q36 17 71 0" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".55"/>${star(119,26,.8)}<path d="M59 57q-7 0-8 9" stroke="#faf8ed" stroke-width="4" fill="none" stroke-linecap="round"/>`;
 else drawing=`<rect x="41" y="51" width="83" height="55" rx="5" fill="#faf8ed" stroke="currentColor" stroke-width="2"/><path d="M42 50l-3-18 81-14 3 18Z" fill="currentColor"/><path d="M51 30l13 11m8-15 13 11m8-15 13 11" stroke="#faf8ed" stroke-width="6"/><path d="M76 65l20 13-20 13Z" fill="var(--accent)"/><path d="M49 115h68" stroke="currentColor" stroke-width="1.5" opacity=".5"/>`;
 return `<svg viewBox="0 0 165 135" fill="none" aria-hidden="true">${specks}${drawing}</svg>`;
}

function directionKey(value){return String(value).trim().replace(/\s+/g,' ').toLocaleLowerCase('ru-RU').replace(/ё/g,'е')}
function directionOptions(records){const unique=new Map();for(const r of records)for(const raw of r.tags||[]){const t=String(raw).trim().replace(/\s+/g,' ');if(t&&!unique.has(directionKey(t)))unique.set(directionKey(t),t)}return [...unique.values()].sort((a,b)=>a.localeCompare(b,'ru'))}
const editBeforeDirections=editCard;
editCard=function(id,dayValue){
 editBeforeDirections(id,dayValue);
 const input=$('#editform input[name="tags"]'),oldLabel=input.closest('label'),selected=new Map();
 for(const raw of input.value.split(',')){const t=raw.trim();if(t)selected.set(directionKey(t),t)}
 let options=directionOptions(db.records);
 for(const [key,t]of selected)if(!options.some(x=>directionKey(x)===key))options.push(t);
 const field=document.createElement('div');field.className='full direction-field';
 field.innerHTML=`<span class="direction-label" id="directions-label">Направления</span><details class="select direction-picker"><summary aria-labelledby="directions-label direction-summary"><span id="direction-summary">Выбрать направления</span></summary><div class="options"><div class="direction-search"><input type="search" id="direction-search" aria-label="Найти или добавить направление" placeholder="Найти или добавить своё…" maxlength="80"></div><div id="direction-options"></div></div></details><div class="direction-chips" id="direction-chips"></div>`;
 oldLabel.replaceWith(field);input.type='hidden';field.append(input);
 const search=field.querySelector('#direction-search'),list=field.querySelector('#direction-options');
 const sync=()=>{input.value=[...selected.values()].join(', ');field.querySelector('#direction-summary').textContent=selected.size?'Выбрано: '+selected.size:'Выбрать направления';field.querySelector('#direction-chips').innerHTML=[...selected.values()].map(t=>`<span class="chip">${E(t)}<button type="button" data-direction-remove="${E(directionKey(t))}" aria-label="Убрать направление ${E(t)}">×</button></span>`).join('')};
 const show=()=>{const q=directionKey(search.value),matches=options.filter(t=>directionKey(t).includes(q)),custom=search.value.trim().replace(/\s+/g,' '),canAdd=q&&!options.some(t=>directionKey(t)===q);list.innerHTML=matches.map(t=>`<label class="direction-option"><input type="checkbox" value="${E(t)}" ${selected.has(directionKey(t))?'checked':''}><span>${E(t)}</span></label>`).join('')+(canAdd?`<button class="add-direction" type="button" id="add-direction">＋ Добавить «${E(custom)}»</button>`:'')+(!matches.length&&!canAdd?'<p class="direction-empty">Пока нет направлений</p>':'')};
 const add=()=>{const t=search.value.trim().replace(/\s+/g,' ');if(!t)return;if(t.includes(',')){toast('Добавляй по одному направлению');return}const key=directionKey(t),existing=options.find(x=>directionKey(x)===key);if(!existing){options.push(t);options.sort((a,b)=>a.localeCompare(b,'ru'))}selected.set(key,existing||t);search.value='';sync();show();search.focus()};
 search.oninput=show;search.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};
 list.onchange=e=>{if(e.target.type!=='checkbox')return;const t=e.target.value,key=directionKey(t);if(e.target.checked)selected.set(key,t);else selected.delete(key);sync()};
 field.addEventListener('click',e=>{const remove=e.target.closest('[data-direction-remove]');if(remove){selected.delete(remove.dataset.directionRemove);sync();show()}if(e.target.closest('#add-direction'))add()});
 sync();show();
};


const legacyPosters={};
let optimizedDatabase=null;
async function optimizeBuiltinPosters(){
 const target=db;if(optimizedDatabase===target)return;optimizedDatabase=target;let changed=false;
 if(!globalThis.crypto?.subtle)return;
 const convert=async(owner,key)=>{const old=owner[key];if(typeof old!=='string'||!old.startsWith('data:image/'))return;const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(old));const path=legacyPosters[Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join('')];if(path&&owner[key]===old){owner[key]=path;changed=true}};
 try{for(const r of target.records){await convert(r,'image');for(const v of r.sessions||[])await convert(v,'poster')}if(changed&&db===target){save();render()}}catch{optimizedDatabase=null}
}

async function portableBackup(source,loadImage){const copy=structuredClone(source),images=new Map();const pack=async(owner,key)=>{const value=owner[key];if(typeof value!=='string'||!/^posters\/[a-f0-9]{24}\.(jpg|png)$/.test(value))return;if(!images.has(value))images.set(value,loadImage(value));owner[key]=await images.get(value)};for(const r of [...copy.records,...(copy.importDrafts||[])]){await pack(r,'image');for(const session of r.sessions||[])await pack(session,'poster')}return {version:2,...copy}}
$('#export').onclick=async()=>{const button=$('#export');button.disabled=true;try{const data=await portableBackup(db,async path=>{const response=await fetch(path);if(!response.ok)throw Error('poster');const blob=await response.blob();if(!blob.type.startsWith('image/'))throw Error('poster');return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)})});const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='personal-cinema-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Резервная копия с постерами готова')}catch{toast('Не удалось включить постеры. Подключись к интернету и повтори экспорт.')}finally{button.disabled=false}};
